name: yuv_camera_example
description: Minimal example for the yuv_camera package.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  yuv_camera:
    path: ..
  yuv_ffi: ^0.5.2
  camera: '>=0.12.1 <0.13.0'
  camera_desktop: ^2.0.0
  camera_platform_interface: ^2.10.0
  google_mlkit_face_detection: ^0.13.1
  share_plus: ^13.3.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.5.4
  web: ^1.1.1

flutter:
  uses-material-design: true
