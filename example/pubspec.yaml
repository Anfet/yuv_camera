publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  yuv_camera:
    path: ..
  yuv_ffi: ^0.5.2
  camera: ^0.11.0+2
